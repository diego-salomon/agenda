<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Agenda</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a deep link like
      // /agenda/plantilla hits this 404 page on a hard load. Rewrite it to
      // /agenda/?/plantilla and bounce to index.html, which restores the real
      // path (see spa-restore.js). pathSegmentsToKeep = 1 for a project page
      // (user.github.io/<repo>/); set it to 0 for a user or custom-domain page.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
